id: eu.nosini.Artemis
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.dotnet10
command: artemis
finish-args:
  # Avalonia, the UI toolkit, only has an X11 backend on Linux. Under Wayland
  # the window runs through Xwayland.
  - --share=ipc
  - --socket=x11
  # Hardware-accelerated rendering of the window.
  - --device=dri
  # Device servers such as OpenRGB's SDK server (127.0.0.1:6742 by default),
  # Artemis's local web API, and the Workshop for plugins and profiles. The
  # sandbox shares the host's network, so localhost is the host's.
  - --share=network
  # The tray icon, which keeps Artemis running when its window is closed.
  # Avalonia registers it as org.kde.StatusNotifierItem-<process ID>-<icon
  # number>, and Artemis is process 2 in the sandbox.
  - --talk-name=org.kde.StatusNotifierWatcher
  - --own-name=org.kde.StatusNotifierItem-2-0
build-options:
  append-path: /usr/lib/sdk/dotnet10/bin
  append-ld-library-path: /usr/lib/sdk/dotnet10/lib
  env:
    DOTNET_ROOT: /usr/lib/sdk/dotnet10/lib
    DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    DOTNET_NOLOGO: 'true'
    # StrawberryShake's GraphQL code generator, run during the build, targets
    # .NET 9; let it run on the extension's newer runtime.
    DOTNET_ROLL_FORWARD: Major
  # Only managed code is compiled. The native libraries come prebuilt with
  # the .NET runtime and the NuGet packages, so a .Debug extension would be
  # empty.
  no-debuginfo: true
modules:
  - name: artemis
    buildsystem: simple
    build-commands:
      # The version Artemis shows and reports to the Workshop is the release's
      # version, the newest one in the metainfo file.
      - |
        version=$(sed -n 's/.*<release version="\([^"]*\)".*/\1/p' eu.nosini.Artemis.metainfo.xml | head -n 1)
        dotnet publish src/Artemis.UI.Linux/Artemis.UI.Linux.csproj \
          --configuration Release --runtime linux-x64 --self-contained \
          --source ./nuget-sources --source /usr/lib/sdk/dotnet10/nuget/packages \
          -p:Version="$version" --output "${FLATPAK_DEST}/lib/artemis"
      - install -Dm755 artemis "${FLATPAK_DEST}/bin/artemis"
      - for size in 16 32 48 64 128 256; do install -Dm644 "src/Artemis.UI.Linux/Icons/${size}x${size}/apps/artemis.png"
        "${FLATPAK_DEST}/share/icons/hicolor/${size}x${size}/apps/${FLATPAK_ID}.png"; done
    sources:
      - type: git
        url: https://github.com/Artemis-RGB/Artemis.git
        commit: 46511022d6eb3c0be72b9aae196495666089ed84
        # Artemis has no release tags. Its update server lists the published
        # releases with their version and commit.
        x-checker-data:
          type: json
          url: https://updating.artemis-rgb.com/graphql/?query=%7BnextPublishedRelease(branch:%22master%22,platform:LINUX)%7Bversion%20commit%20createdAt%7D%7D
          commit-query: .data.nextPublishedRelease.commit
          version-query: .data.nextPublishedRelease.version
          timestamp-query: .data.nextPublishedRelease.createdAt
          is-main-source: true
      - type: patch
        path: patches/0001-disable-updating-argument.patch
      # NuGet packages, generated by scripts/generate-dotnet-deps.sh.
      - nuget-sources.json
      - type: file
        path: launcher/artemis
      - type: file
        path: eu.nosini.Artemis.metainfo.xml

  - name: metadata
    buildsystem: simple
    build-commands:
      - install -Dm644 eu.nosini.Artemis.metainfo.xml -t "${FLATPAK_DEST}/share/metainfo"
      - install -Dm644 eu.nosini.Artemis.desktop -t "${FLATPAK_DEST}/share/applications"
    sources:
      - type: file
        path: eu.nosini.Artemis.metainfo.xml
      - type: file
        path: eu.nosini.Artemis.desktop
