name: Flatpak

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this build to the stable repository (main or a stable tag)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Runs that can publish share one group across refs, so two of them never
  # sign and deploy competing repositories built from different published
  # heads. A manual run without the publish input is only a build and cache
  # warm-up, so it gets a group of its own and can't cancel a publication.
  group: >-
    flatpak-${{ ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
                  inputs.publish == true) && 'publish' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  APP_ID: eu.nosini.Artemis
  # Title of the published repository, and the remote name and file names
  # users install from.
  APP_NAME: Artemis
  REMOTE_NAME: artemis
  FLATPAK_BRANCH: stable
  # Cache namespace. Bump it to start over; the key and the restore prefix
  # both use it.
  CACHE_PREFIX: flatpak-v1

jobs:
  setup:
    # The template itself has nothing to build.
    if: github.repository != 'nosini/flatpak-template'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.arches.outputs.matrix }}
      publish: ${{ steps.arches.outputs.publish }}
      stable: ${{ steps.release.outputs.stable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Tag builds and manual reruns use the event's exact commit.
          ref: ${{ github.sha }}
          persist-credentials: false

      # Artemis versions have four numeric parts. Numeric packaging revisions
      # are stable too; other suffixes must not replace the stable repository.
      - name: Classify the release tag
        id: release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          stable=false
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?$ ]]; then
            stable=true
          fi
          echo "stable=$stable" >> "$GITHUB_OUTPUT"

      # The release title and the published version come from the tag, while
      # the metainfo carries the version users and software centers see. A tag
      # whose version wasn't bumped would publish the old version under the
      # new name, so compare the tag with the metadata here.
      - name: Check the release tag against the app version
        if: steps.release.outputs.stable == 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          # A numeric suffix is a packaging revision of the same app version.
          version=${version%%-*}
          app_version=$(python3 - "$APP_ID" <<'EOF'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse(f"{sys.argv[1]}.metainfo.xml").getroot()
          print(root.find("releases/release").get("version"))
          EOF
          )
          if [[ "$version" != "$app_version" ]]; then
            echo "Tag $TAG does not match the app version $app_version." >&2
            exit 1
          fi

      # Like Flathub, build x86_64 and aarch64 unless flathub.json limits the
      # architectures with only-arches or skip-arches.
      - name: Select architectures
        id: arches
        env:
          PUBLISH: >-
            ${{ vars.PUBLISH_FLATPAK == 'true' &&
                (github.event_name != 'workflow_dispatch' || inputs.publish) &&
                ((startsWith(github.ref, 'refs/tags/v') && steps.release.outputs.stable == 'true') ||
                 (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) }}
          # Publishing is opt-in on manual runs; refuse a request that the
          # event can't publish instead of building quietly without it.
          PUBLISH_REQUESTED: ${{ inputs.publish }}
        run: |
          if [[ "$PUBLISH_REQUESTED" == true && "$PUBLISH" != true ]]; then
            echo 'publish needs PUBLISH_FLATPAK=true and a stable version tag or a run on main.' >&2
            exit 1
          fi
          config=$(cat flathub.json 2>/dev/null || echo '{}')
          matrix=$(jq -c '
            ."only-arches" as $only | (."skip-arches" // []) as $skip
            | [{arch: "x86_64", runner: "ubuntu-24.04"}, {arch: "aarch64", runner: "ubuntu-24.04-arm"}]
            | map(select(($only == null or (.arch | IN($only[]))) and (.arch | IN($skip[]) | not)))
          ' <<< "$config")
          test "$matrix" != '[]'
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    strategy:
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
      fail-fast: false
    runs-on: ${{ matrix.runner }}
    container:
      # Keep the tag and digest in step with the manifest's runtime-version.
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08@sha256:6ed6921bb5a9e1a916989971844f159b854b7b225880c381fa34f7a158863039
      # Bubblewrap needs namespaces unavailable in an ordinary Docker container.
      options: --privileged
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: true

      - name: Lint the manifest and validate metainfo
        run: |
          flatpak-builder-lint --gha-format --exceptions --user-exceptions lint-exceptions.json \
            manifest "$APP_ID.yml"
          # Validate metadata without making upstream website availability a
          # prerequisite for building the package.
          appstreamcli validate --no-net --explain "$APP_ID.metainfo.xml"

      # The image ships its runtimes in read-only layers, and overlayfs refuses
      # the directory renames flatpak makes when flatpak-builder updates them
      # ("Invalid cross-device link", then a crash). Once Flathub has a newer
      # SDK than the image, every build would fail. Copying the installations
      # into the container's writable layer makes them updatable.
      # https://github.com/flatpak/flatpak-github-actions/issues/267
      - name: Make the preinstalled runtimes updatable
        run: |
          for dir in $(flatpak --installations); do
            cp -a "$dir" "$dir.copy"
            rm -rf "$dir"
            mv "$dir.copy" "$dir"
          done

      # The key covers this workflow and the pinned NuGet sources, so changing
      # either starts a new snapshot; the container image is pinned by digest,
      # so a new image changes the workflow too. Downloads and module results
      # are reused, as is the compiler cache.
      - name: Restore the Flatpak build cache
        id: build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .flatpak-builder
          key: ${{ env.CACHE_PREFIX }}-${{ runner.os }}-${{ matrix.arch }}-${{ env.APP_ID }}-${{ env.FLATPAK_BRANCH }}-${{ hashFiles('.github/workflows/flatpak.yml', 'nuget-sources.json') }}
          restore-keys: |
            ${{ env.CACHE_PREFIX }}-${{ runner.os }}-${{ matrix.arch }}-${{ env.APP_ID }}-${{ env.FLATPAK_BRANCH }}-

      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6
        with:
          manifest-path: ${{ env.APP_ID }}.yml
          branch: ${{ env.FLATPAK_BRANCH }}
          arch: ${{ matrix.arch }}
          build-dir: build-dir
          repo-dir: repo
          bundle: ${{ env.REMOTE_NAME }}-${{ matrix.arch }}.flatpak
          artifact-name: ${{ env.REMOTE_NAME }}-${{ matrix.arch }}
          # Keep ccache enabled; restore and save the state directory in the
          # surrounding steps, so only a passing build is saved.
          cache: true
          restore-cache: false
          save-cache: false
          state-dir: .flatpak-builder

      - name: Lint the exported build
        run: |
          flatpak-builder-lint --gha-format --exceptions --user-exceptions lint-exceptions.json \
            repo repo

      - name: Check the installed app against its runtime
        env:
          FLATPAK_ARCH: ${{ matrix.arch }}
        run: bash scripts/test-installed.sh

      - name: Pack the tested repository
        if: needs.setup.outputs.publish == 'true'
        run: tar -cf "repo-${{ matrix.arch }}.tar" repo

      - name: Upload the tested repository
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: needs.setup.outputs.publish == 'true'
        with:
          name: repo-${{ matrix.arch }}
          path: repo-${{ matrix.arch }}.tar
          retention-days: 1
          if-no-files-found: error

      # Snapshots saved on other refs can only be restored by reruns of the
      # same ref, and GitHub keeps one pending run per group. Save after the
      # artifact so a slow upload can't hold back the tested repository.
      - name: Save the tested Flatpak build cache
        if: >-
          steps.build-cache.outputs.cache-hit != 'true' &&
          github.ref_name == github.event.repository.default_branch
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .flatpak-builder
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

  # Signing runs in its own job, so the key is never present where the
  # upstream build ran.
  publish:
    needs: [setup, build]
    if: needs.setup.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08@sha256:6ed6921bb5a9e1a916989971844f159b854b7b225880c381fa34f7a158863039
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: repo-*
          path: inputs
          merge-multiple: true

      - name: Unpack the tested repositories
        run: |
          for archive in inputs/repo-*.tar; do
            arch=$(basename "$archive" .tar)
            mkdir "inputs/$arch"
            tar -xf "$archive" -C "inputs/$arch"
          done

      - name: Import signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          if [[ -z "$GPG_PRIVATE_KEY" ]]; then
            echo 'Set FLATPAK_GPG_PRIVATE_KEY before enabling PUBLISH_FLATPAK.' >&2
            exit 1
          fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          key=$(gpg --batch --list-secret-keys --with-colons | awk -F: '$1 == "fpr" && !key { key = $10 } END { print key }')
          test -n "$key"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "GPG_KEY=$key" >> "$GITHUB_ENV"

      - name: Sign and prepare the repository
        env:
          REPO_URL: ${{ vars.FLATPAK_REPO_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
          HOMEPAGE: ${{ github.server_url }}/${{ github.repository }}
          KEEP_HISTORY: ${{ vars.FLATPAK_KEEP_HISTORY != 'false' }}
        run: bash scripts/prepare-repository.sh inputs/repo-*/repo

      # A client that only knows the public key must accept the summary, the
      # app and its extensions, and the software catalog of every
      # architecture. Flatpak only loads the summaries of the runner's own
      # architecture when updating catalogs, so the commits are pulled with
      # OSTree, which rejects them unless they are signed.
      - name: Verify the signed repository
        run: |
          public_key_file="$RUNNER_TEMP/signing-public-key.gpg"
          gpg --batch --export --export-options export-minimal "$GPG_KEY" > "$public_key_file"
          test -s "$public_key_file"
          flatpak --user remote-add --gpg-import="$public_key_file" signed-test "$PWD/signed-repo"
          verify_repo="$RUNNER_TEMP/verify-repo"
          ostree --repo="$verify_repo" init --mode=bare-user-only
          ostree --repo="$verify_repo" remote add --set=gpg-verify=true \
            --set=gpg-verify-summary=true \
            --gpg-import="$public_key_file" signed-test "file://$PWD/signed-repo"
          mapfile -t refs < <(ostree --repo=signed-repo refs | grep -E '^(app|runtime)/')
          if (( ${#refs[@]} == 0 )); then
            echo 'The signed repository has no app or runtime refs.' >&2
            exit 1
          fi
          # Every app and extension commit must carry the key's signature.
          ostree --repo="$verify_repo" pull signed-test "${refs[@]}"
          arches=$(printf '%s\n' "${refs[@]}" \
            | sed -n "s|^app/$APP_ID/\([^/]*\)/.*|\1|p" | sort -u)
          if [[ -z "$arches" ]]; then
            echo "The signed repository has no $APP_ID refs." >&2
            exit 1
          fi
          for arch in $arches; do
            flatpak --user remote-ls --arch="$arch" signed-test | grep -F "$APP_ID"
            ostree --repo="$verify_repo" pull signed-test "appstream2/$arch"
            ostree --repo="$verify_repo" cat "signed-test:appstream2/$arch" /appstream.xml \
              | grep -qF "<id>$APP_ID</id>"
          done
          flatpak --user remote-delete signed-test
          rm -rf "$verify_repo"

      - name: Remove imported key
        if: always()
        run: |
          if [[ -d "$RUNNER_TEMP/gnupg" ]]; then
            GNUPGHOME="$RUNNER_TEMP/gnupg" gpgconf --kill all || true
            rm -rf "$RUNNER_TEMP/gnupg"
          fi

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: signed-repo

  deploy:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  # The shared remote collects packages only after Pages serves the signed repo.
  # A separate token is needed because GITHUB_TOKEN cannot dispatch another repo.
  announce:
    needs: deploy
    runs-on: ubuntu-24.04
    permissions: {}
    defaults:
      run:
        shell: bash
    steps:
      - name: Announce the publication to the shared remote
        env:
          GH_TOKEN: ${{ secrets.FLATPAK_REPO_DISPATCH_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo '::error::Set FLATPAK_REPO_DISPATCH_TOKEN with Contents: write access to nosini/flatpak-repo to notify the shared remote.'
            exit 1
          fi
          gh api --method POST repos/nosini/flatpak-repo/dispatches -f event_type=app-published

  # Create the release only after validation and any required Pages deployment.
  # Authentication comes from the runner's GITHUB_TOKEN.
  release:
    needs: [setup, build, publish, deploy]
    if: >-
      ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') &&
          (github.event_name != 'workflow_dispatch' || inputs.publish) &&
          needs.setup.result == 'success' && needs.build.result == 'success' &&
          ((needs.setup.outputs.publish == 'true' && needs.publish.result == 'success' &&
            needs.deploy.result == 'success') ||
           (needs.setup.outputs.publish == 'false' && needs.publish.result == 'skipped' &&
            needs.deploy.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      STABLE: ${{ needs.setup.outputs.stable }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: ${{ env.REMOTE_NAME }}-*
          path: bundles
          merge-multiple: true

      - name: Create the release and upload the tested bundles
        run: |
          shopt -s nullglob
          bundles=(bundles/*.flatpak)
          if (( ${#bundles[@]} == 0 )); then
            echo 'No tested bundles were downloaded.' >&2
            exit 1
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            if [[ "$STABLE" != true ]]; then
              gh release edit "$TAG" --prerelease --latest=false
            fi
            gh release upload "$TAG" "${bundles[@]}" --clobber
            # Finish a draft left by an interrupted release creation too.
            gh release edit "$TAG" --draft=false
          else
            options=(--verify-tag --title "$APP_NAME ${TAG#v}" --generate-notes)
            if [[ "$STABLE" != true ]]; then
              options+=(--prerelease --latest=false)
            fi
            gh release create "$TAG" "${bundles[@]}" "${options[@]}"
          fi
